name: 'Set Thread Image Sensitive [本番]'

on:
  workflow_dispatch:
    inputs:
      thread_id:
        description: 'スレッドのID（通報フォームに記録された ID、またはスレッド詳細の URL の末尾）'
        required: true
        type: string
      sensitive:
        description: 'true: センシティブに設定（タップするまで表示しない） / false: 解除'
        required: true
        type: choice
        default: 'true'
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  set-sensitive:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Set thread image sensitive
        env:
          API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}
          MARKET_CLEANUP_TOKEN: ${{ secrets.MARKET_CLEANUP_TOKEN }}
          ID: ${{ inputs.thread_id }}
          SENSITIVE: ${{ inputs.sensitive }}
        run: |
          if [ -z "$API_BASE_URL" ] || [ -z "$MARKET_CLEANUP_TOKEN" ]; then
            echo "VITE_API_BASE_URL or MARKET_CLEANUP_TOKEN is not configured."
            exit 1
          fi

          if ! [[ "$ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "スレッドIDの形式が正しくありません（UUID を指定してください）: $ID"
            exit 1
          fi

          # 失敗時も API のエラーメッセージをログに出すため、bash -e で止まる前に表示する
          if ! response=$(curl --fail-with-body --silent --show-error \
            -X PUT "${API_BASE_URL%/}/internal/threads/$ID/image-sensitive" \
            -H "X-Maintenance-Token: $MARKET_CLEANUP_TOKEN" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d "{\"isSensitive\":$SENSITIVE}"); then
            echo "$response"
            exit 1
          fi

          echo "$response"
