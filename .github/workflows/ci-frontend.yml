name: Check Frontend

on:
  push:
    branches: [ main ]
    paths:
      - 'client/**'
      - '.github/workflows/ci-frontend.yml'
  # 必須チェック（job 名）に使っているので、PR には paths を付けない
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (format/lint/build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: client

      - name: Format check
        run: pnpm run format:check
        working-directory: client

      - name: Lint
        run: pnpm run lint
        working-directory: client

      - name: Build
        run: pnpm run build
        working-directory: client
