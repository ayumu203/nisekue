name: Cleanup Expired Market Listings - Development

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Trigger cleanup endpoint
        env:
          API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}
          MARKET_CLEANUP_TOKEN: ${{ secrets.MARKET_CLEANUP_TOKEN }}
        run: |
          if [ -z "$API_BASE_URL" ] || [ -z "$MARKET_CLEANUP_TOKEN" ]; then
            echo "VITE_API_BASE_URL or MARKET_CLEANUP_TOKEN is not configured."
            exit 1
          fi

          cleanup_url="${API_BASE_URL%/}/internal/market/listings/cleanup-expired"

          response=$(curl --fail-with-body --silent --show-error \
            -X POST "$cleanup_url" \
            -H "X-Maintenance-Token: $MARKET_CLEANUP_TOKEN" \
            -H "Accept: application/json")

          echo "$response"
