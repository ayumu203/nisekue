name: Code Check (Format/Lint/Build/Test)

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - 'client/**'
      - 'tests/**'
      - 'tools/masterdata/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (format/lint/build/test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Nisekue.sln

      - name: Format check
        run: dotnet format server/server.csproj whitespace --verify-no-changes --no-restore

      - name: Lint check
        run: dotnet format server/server.csproj analyzers --verify-no-changes --no-restore

      - name: Build
        run: dotnet build server/server.csproj -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test tests/server.tests/server.tests.csproj -c Release --no-restore --verbosity normal

  # テスト用 CSV とスプレッドシートの形が一致しているか、PR のコードでスプレッドシートを読めるかを確認する。
  # コードやテスト用 CSV の列を変えたのにスプレッドシートを直し忘れた、をマージ前に検出するため。
  masterdata:
    name: Master data (spreadsheet vs fixtures)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: tools/masterdata/pnpm-lock.yaml

      - name: Import master data from spreadsheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MASTERDATA_SPREADSHEET_ID: ${{ vars.MASTERDATA_SPREADSHEET_ID }}
        run: |
          if [ -z "${GOOGLE_SERVICE_ACCOUNT_JSON}" ] || [ -z "${MASTERDATA_SPREADSHEET_ID}" ]; then
            echo "::error::Secret GOOGLE_SERVICE_ACCOUNT_JSON と Variable MASTERDATA_SPREADSHEET_ID（リポジトリ単位）を設定してください。"
            exit 1
          fi
          pnpm masterdata:sync

      - name: Compare structure with fixtures
        run: node tools/masterdata/src/structure.mjs tests/server.tests/fixtures/resources server/resources

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate master data with this code
        run: |
          dotnet test tests/server.tests/server.tests.csproj -c Release -p:UseMasterDataFixtures=false \
            --filter "FullyQualifiedName~server.tests.masterdata.MasterDataIntegrityTests"

  frontend:
    name: Frontend (format/lint/build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: client

      - name: Format check
        run: pnpm run format:check
        working-directory: client

      - name: Lint
        run: pnpm run lint
        working-directory: client

      - name: Build
        run: pnpm run build
        working-directory: client
