name: Sync Master Data (staging -> production)

# ステージング用スプレッドシートの内容で本番用スプレッドシートを上書きし、本番のバックエンドを再デプロイする。
# スプレッドシートの「nisekue → 本番へ同期」メニュー（ステージング用スプレッドシートの Apps Script）か、Actions の画面から手動実行する。
#
# 1. validate（dev environment）: ステージング用スプレッドシートを main のコードで整合性テストし、本番用との差分をサマリーに出す
# 2. sync（prod environment）: 本番用スプレッドシートを上書きする。prod environment の承認（Required reviewers）を付けておくこと
# 3. 続けて deploy-backend-vm-prod.yml を prod ブランチで起動する（inputs.deploy が true のとき）
#
# スプレッドシートの ID はどちらも Variable MASTERDATA_SPREADSHEET_ID で決まる。
#   dev environment  : ステージング用（environment 単位で上書きしておく）
#   prod environment : 本番用（リポジトリ単位の値）
# サービスアカウントは本番用スプレッドシートの「編集者」である必要がある（ステージング用は閲覧者でよい）。

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 同期後に本番のバックエンドを再デプロイする
        type: boolean
        default: true
      dry_run:
        description: 差分の確認だけ行い、本番用スプレッドシートは書き換えない
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-masterdata-to-prod
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      staging-spreadsheet-id: ${{ steps.ids.outputs.staging }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record spreadsheet id
        id: ids
        run: echo "staging=${{ vars.MASTERDATA_SPREADSHEET_ID }}" >> "$GITHUB_OUTPUT"

      - name: Import and validate staging master data
        uses: ./.github/actions/masterdata-import
        with:
          google-service-account-json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          spreadsheet-id: ${{ vars.MASTERDATA_SPREADSHEET_ID }}

  sync:
    needs: validate
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check spreadsheet ids
        env:
          STAGING_ID: ${{ needs.validate.outputs.staging-spreadsheet-id }}
          PRODUCTION_ID: ${{ vars.MASTERDATA_SPREADSHEET_ID }}
        run: |
          if [ -z "${STAGING_ID}" ] || [ -z "${PRODUCTION_ID}" ]; then
            echo "::error::MASTERDATA_SPREADSHEET_ID が dev / prod のどちらかで取得できません。"
            exit 1
          fi
          if [ "${STAGING_ID}" = "${PRODUCTION_ID}" ]; then
            echo "::error::dev environment の MASTERDATA_SPREADSHEET_ID が本番用と同じです。ステージング用スプレッドシートの ID で上書きしてください。"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: tools/masterdata/pnpm-lock.yaml

      - name: Install
        run: pnpm --dir tools/masterdata install --frozen-lockfile

      - name: Sync to production spreadsheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          STAGING_ID: ${{ needs.validate.outputs.staging-spreadsheet-id }}
          PRODUCTION_ID: ${{ vars.MASTERDATA_SPREADSHEET_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--from "${STAGING_ID}" --to "${PRODUCTION_ID}")
          if [ "${DRY_RUN}" = "true" ]; then args+=(--dry-run); fi
          node tools/masterdata/src/syncToProduction.mjs "${args[@]}"

  deploy:
    needs: sync
    if: inputs.deploy && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start production deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-backend-vm-prod.yml --repo "${{ github.repository }}" --ref prod
          echo "本番のデプロイを起動しました: https://github.com/${{ github.repository }}/actions/workflows/deploy-backend-vm-prod.yml" >> "$GITHUB_STEP_SUMMARY"
