name: Apply DB Migrations

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/db-migrate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__Supabase: ${{ secrets.SUPABASE_DB_CONNECTION_STRING }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.3

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Restore
        run: dotnet restore server/server.csproj

      - name: Apply migrations
        run: dotnet ef database update --project server/server.csproj --startup-project server/server.csproj
