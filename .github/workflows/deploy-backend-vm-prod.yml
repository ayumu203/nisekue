name: 'Deploy Backend [本番]'

# prod への push で、Oracle Cloud の VM 上のバックエンド（docker compose）を更新する。
# マスタデータは GitHub Actions 上でスプレッドシートから取り込み、整合性テストを通してから VM に送る
# （Google の認証情報は VM に置かない）。VM では push されたコミットを checkout し、
# 送った CSV を server/resources に置いてからイメージを再ビルド・再起動する。
# スプレッドシートだけを反映したいときは、prod ブランチでこの workflow を手動実行する。
#
# 必要な Secrets（prod environment）:
#   VM_HOST         VM のパブリック IP
#   VM_SSH_KEY      デプロイ専用の SSH 秘密鍵
#   VM_KNOWN_HOSTS  `ssh-keyscan -t ed25519 <VM_HOST>` の出力（ホスト鍵の固定）
# 必要な Secret / Variable（マスタデータ）:
#   GOOGLE_SERVICE_ACCOUNT_JSON  サービスアカウントキー（JSON）
#   MASTERDATA_SPREADSHEET_ID    本番のスプレッドシートの ID

on:
  push:
    branches: [ prod ]
    paths:
      - 'server/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'tools/masterdata/**'
      - '.github/actions/masterdata-import/**'
      - '.github/workflows/deploy-backend-vm-prod.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend-vm-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 30

    steps:
      # 手動実行で prod 以外のブランチを本番に出してしまわないようにする
      - name: Check branch
        if: github.ref != 'refs/heads/prod'
        run: |
          echo "::error::本番へのデプロイは prod ブランチからのみ実行できます（現在: ${GITHUB_REF}）。"
          exit 1

      - name: Validate secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          for name in VM_HOST VM_SSH_KEY VM_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not configured in the prod environment."
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # ここで失敗した場合は VM に触らずに止まるので、本番は前のまま動き続ける
      - name: Import master data
        uses: ./.github/actions/masterdata-import
        with:
          google-service-account-json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          spreadsheet-id: ${{ vars.MASTERDATA_SPREADSHEET_ID }}

      - name: Package master data
        run: |
          cd server/resources
          find . -name '*.csv' -print0 | tar --null -czf "${RUNNER_TEMP}/masterdata.tar.gz" -T -
          echo "CSV: $(tar -tzf "${RUNNER_TEMP}/masterdata.tar.gz" | grep -c '\.csv$') ファイル"

      - name: Configure SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload master data to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=20 \
            "${RUNNER_TEMP}/masterdata.tar.gz" \
            "ubuntu@${VM_HOST}:/tmp/nisekue-masterdata-${DEPLOY_SHA}.tar.gz"

      - name: Deploy on VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=20 \
            "ubuntu@${VM_HOST}" \
            "bash -s -- '${DEPLOY_SHA}'" <<'REMOTE'
          set -euo pipefail
          sha="$1"
          archive="/tmp/nisekue-masterdata-${sha}.tar.gz"
          trap 'rm -f "${archive}"' EXIT
          cd /opt/nisekue

          if [ ! -f .env ]; then
            echo "::error::/opt/nisekue/.env が見つかりません。"
            exit 1
          fi
          if [ ! -s "${archive}" ]; then
            echo "::error::マスタデータ（${archive}）が見つかりません。"
            exit 1
          fi

          echo "==> Checkout ${sha}"
          git fetch --quiet origin prod
          git checkout --quiet --force prod
          git reset --quiet --hard "${sha}"

          # checkout の後に置く（CSV を消すコミットを取り込んだときに消されないように）
          echo "==> Master data"
          mkdir -p server/resources
          find server/resources -name '*.csv' -delete
          tar -xzf "${archive}" -C server/resources
          echo "$(find server/resources -name '*.csv' | wc -l) CSV files"

          echo "==> Build and restart"
          docker compose up -d --build --remove-orphans

          echo "==> Health check"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              echo "Backend is healthy (${sha})."
              docker image prune -f >/dev/null
              exit 0
            fi
            sleep 2
          done

          echo "::error::Health check failed."
          docker compose ps
          docker compose logs api --tail 100
          exit 1
          REMOTE

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
