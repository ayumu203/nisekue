name: Rebuild Rankings - Production

on:
  schedule:
    - cron: '5 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Trigger ranking rebuild endpoint
        env:
          API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}
          MARKET_CLEANUP_TOKEN: ${{ secrets.MARKET_CLEANUP_TOKEN }}
        run: |
          if [ -z "$API_BASE_URL" ] || [ -z "$MARKET_CLEANUP_TOKEN" ]; then
            echo "VITE_API_BASE_URL or MARKET_CLEANUP_TOKEN is not configured."
            exit 1
          fi

          rebuild_url="${API_BASE_URL%/}/internal/rankings/rebuild"

          response=$(curl --fail-with-body --silent --show-error \
            -X POST "$rebuild_url" \
            -H "X-Maintenance-Token: $MARKET_CLEANUP_TOKEN" \
            -H "Accept: application/json")

          echo "$response"
