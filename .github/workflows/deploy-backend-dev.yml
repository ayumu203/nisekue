name: Deploy Backend - Development

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - 'tools/masterdata/**'
      - '.github/actions/masterdata-import/**'
      - '.github/workflows/deploy-backend-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # マスタデータはリポジトリに置かず、デプロイのたびにスプレッドシートから取り込む。
      # サーバーが起動できないデータ（型の誤りや存在しないIDの参照など）ならここで止まる。
      # スプレッドシートは Variable MASTERDATA_SPREADSHEET_ID で決まる（環境単位で上書きすればステージング用に切り替えられる）
      - name: Import master data
        uses: ./.github/actions/masterdata-import
        with:
          google-service-account-json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          spreadsheet-id: ${{ vars.MASTERDATA_SPREADSHEET_ID }}

      - name: Restore
        run: dotnet restore server/server.csproj

      - name: Build
        run: dotnet build server/server.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish server/server.csproj -c Release --no-build -o publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND_DEV }}
          package: publish
