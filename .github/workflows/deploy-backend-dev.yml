name: Deploy Backend - Development

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: tools/masterdata/pnpm-lock.yaml

      # マスタデータはリポジトリに置かず、デプロイのたびにスプレッドシートから取り込む
      - name: Import master data from spreadsheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MASTERDATA_SPREADSHEET_ID: ${{ vars.MASTERDATA_SPREADSHEET_ID }}
        run: |
          if [ -z "${GOOGLE_SERVICE_ACCOUNT_JSON}" ] || [ -z "${MASTERDATA_SPREADSHEET_ID}" ]; then
            echo "::error::Secret GOOGLE_SERVICE_ACCOUNT_JSON と Variable MASTERDATA_SPREADSHEET_ID を設定してください。"
            exit 1
          fi
          pnpm masterdata:sync

      # サーバーが起動できないデータ（型の誤りや存在しないIDの参照など）ならここで止める
      - name: Validate master data
        run: |
          dotnet test tests/server.tests/server.tests.csproj -c Release -p:UseMasterDataFixtures=false \
            --filter "FullyQualifiedName~server.tests.masterdata.MasterDataIntegrityTests"

      - name: Restore
        run: dotnet restore server/server.csproj

      - name: Build
        run: dotnet build server/server.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish server/server.csproj -c Release --no-build -o publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND_DEV }}
          package: publish
